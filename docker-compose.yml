services:
  kong:
    image: kong:3.9
    container_name: kong
    restart: unless-stopped
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /opt/kong/kong.yml
      KONG_PLUGINS: "bundled,sg-jwt"
      KONG_LUA_PACKAGE_PATH: "/opt/kong/custom/?.lua;;"
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      # The Admin API has no authentication: it only listens inside the
      # container (use `docker exec kong curl -s localhost:8001/...`). The GUI is off.
      KONG_ADMIN_LISTEN: "127.0.0.1:8001"
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_GUI_LISTEN: "off"
      # Caddy sits in front of Kong and appends the client address to
      # X-Forwarded-For. Trusting it lets per-IP rate limiting and the upstream
      # services see the real client instead of Caddy. Safe only because the
      # proxy port below is not reachable from outside the host.
      KONG_TRUSTED_IPS: "0.0.0.0/0,::/0"
      KONG_REAL_IP_HEADER: "X-Forwarded-For"
      KONG_REAL_IP_RECURSIVE: "on"
    volumes:
      - ./kong/kong.yml:/opt/kong/kong.yml:ro
      - ./kong/plugins:/opt/kong/custom/kong/plugins:ro
    ports:
      # Loopback only, for local debugging. In the server Caddy reaches
      # kong:8000 over the Docker network.
      - "127.0.0.1:8000:8000"
    networks:
      - sg-services-network

networks:
  sg-services-network:
    external: true
