_format_version: "3.0"

services: 
  - name: ms-user-management
    url: http://ms-user-management:8080
    routes:
      - name: user-management-route
        paths:
          - /user
        methods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        strip_path: true
    plugins:
      - name: cors
        config:
          origins: 
            - http://localhost:4200
          methods:
            - GET
            - POST
            - PUT
            - DELETE
            - OPTIONS
          headers:
            - Accept
            - Authorization
            - Content-Type
          exposed_headers:
            - Location
          credentials: true
          max_age: 3600