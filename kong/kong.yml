_format_version: "3.0"

services: 
  - name: ms-iam
    url: http://ms-iam:8080
    routes:
      - name: iam-auth-route
        paths:
          - /api/v1/auth
        methods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        strip_path: false
    plugins:
      - name: cors
        config:
          origins:
            - http://localhost:4200
          methods:
            - GET
            - POST
            - PUT
            - DELETE
            - OPTIONS
          headers:
            - Accept
            - Authorization
            - Content-Type
          exposed_headers:
            - Location
          credentials: true
          max_age: 3600
      - name: rate-limiting
        config:
          minute: 60
          policy: local
          limit_by: ip

  - name: ms-user-management
