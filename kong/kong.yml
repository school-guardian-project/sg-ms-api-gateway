_format_version: "3.0"

# Global plugin: validates the RS256 access token presented to the protected
# routes and injects the authenticated identity as X-User-* headers.
# Public routes (login / refresh / forgot-password) are listed in public_paths
# so they are reachable without a token; inbound X-User-* headers are stripped
# on every request regardless.
plugins:
  - name: sg-jwt
    config:
      jwks_url: http://ms-iam:8080/.well-known/jwks.json
      issuer: school-guardian-iam
      audience: school-guardian-api
      public_paths:
        - /api/v1/auth
        - /api/v1/password
        - /api/v1/auth/health

services: 
  - name: ms-iam
    url: http://ms-iam:8080
    routes:
      - name: iam-auth-route
        paths:
          - /api/v1/auth
        methods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        strip_path: false
    plugins:
      - name: cors
        config:
          origins:
            - http://localhost:4200
            - https://2btcbqw-anonymous-9081.exp.direct
            - https://incurred-stroke-town-fares.trycloudflare.com
            - https://school-guardian.duckdns.org
            - https://guardian-escolar.vercel.app
            - capacitor://localhost
            - ionic://localhost
            - http://localhost
            - https://localhost
          methods:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
            - OPTIONS
          headers:
            - Accept
            - Authorization
            - Content-Type
            - Origin
            - X-Requested-With
          exposed_headers:
            - Location
            - Set-Cookie
          credentials: true
          max_age: 3600
      - name: rate-limiting
        config:
          minute: 300
          policy: local
          limit_by: header
          header_name: Authorization

  - name: ms-user-management
    url: http://ms-user-management:8080
