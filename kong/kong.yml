_format_version: "3.0"

# Global plugin: validates the RS256 access token presented to the protected
# routes and injects the authenticated identity as X-User-* headers.
# Public routes (login / refresh / forgot-password) are listed in public_paths
# so they are reachable without a token; inbound X-User-* headers are stripped
# on every request regardless.
plugins:
  - name: sg-jwt
    config:
      jwks_url: http://ms-iam:8080/.well-known/jwks.json
      issuer: school-guardian-iam
      audience: school-guardian-api
      public_paths:
        - /api/v1/auth
        - /api/v1/password
        - /api/v1/auth/health
        - /.well-known/jwks.json

services: 
  - name: ms-iam
    url: http://ms-iam:8080
    routes:
      - name: iam-auth-route
        paths:
          - /api/v1/auth
        methods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        strip_path: false
      - name: iam-jwks-route
        paths:
          - /.well-known/jwks.json
        methods:
          - GET
        strip_path: false
    plugins:
      - name: cors
        config: *common_cors
      - name: rate-limiting
        config:
          minute: 300
          policy: local
          limit_by: header
          header_name: Authorization

  - name: ms-user-management
    url: http://ms-user-management:8080
    routes:
      - name: user-management-route
        paths:
          - /user
        methods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS
        strip_path: true
    plugins:
      - name: cors
        config: *common_cors

  - name: ms-fleet
    url: http://ms-fleet:8080
    routes:
      - name: fleet-route
        paths:
          - /fleet
        methods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS
        strip_path: true
    plugins:
      - name: cors
        config: *common_cors

  - name: ms-school-management
    url: http://ms-school-management:8080
    routes:
      - name: school-management-route
        paths:
          - /school-management
        methods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        strip_path: true
    plugins:
      - name: cors
        config: *common_cors

  - name: ms-notification
    url: http://ms-notification:8080
    routes:
      - name: notification-route
        paths:
          - /notification
        methods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS
        strip_path: true
    plugins:
      - name: cors
        config: *common_cors

  - name: ms-route
    url: http://ms-route:8080
    routes:
      - name: route-service-route
        paths:
          - /route
          - /trip
        methods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS
        strip_path: true
    plugins:
      - name: cors
        config: *common_cors

  - name: ms-forgot-information
    url: http://ms-forgot-information:8080
    routes:
      - name: forgot-password-route
        paths:
          - /api/v1/password
        methods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        strip_path: false
      - name: forgot-email-change-route
        paths:
          - /api/v1/email/change
        methods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        strip_path: false
      - name: forgot-phone-change-route
        paths:
          - /api/v1/phone/change
        methods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        strip_path: false
    plugins:
      - name: cors
        config: *common_cors

  - name: ms-gps
    url: http://ms-gps:8080
    routes:
      - name: gps-route
        paths:
          - /api/gps
        methods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        strip_path: false
    plugins:
      - name: cors
        config: *common_cors