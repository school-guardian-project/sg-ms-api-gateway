_format_version: "3.0"

# Global plugin: validates the RS256 access token presented to the protected
# routes and injects the authenticated identity as X-User-* headers.
# Public routes (login / refresh / logout / forgot-password) are listed in
# public_paths so they are reachable without a token; inbound X-User-* headers
# are stripped on every request regardless.
#
# public_paths are prefixes, so each IAM entry names the exact endpoint: a bare
# /api/v1/auth would also make /profile and /terms/* public at the gateway.
# Logout stays public so a client holding an expired token can still sign out.
plugins:
  - name: sg-jwt
    config:
      jwks_url: http://ms-iam:8080/.well-known/jwks.json
      issuer: school-guardian-iam
      audience: school-guardian-api
      public_paths:
        - /api/v1/auth/login
        - /api/v1/auth/refresh
        - /api/v1/auth/logout
        - /api/v1/auth/health
        - /api/v1/password
        - /.well-known/jwks.json

services: 
  - name: ms-iam
    url: http://ms-iam:8080
    routes:
      - name: iam-auth-route
        paths:
          - /api/v1/auth
        methods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        strip_path: false
      - name: iam-jwks-route
        paths:
          - /.well-known/jwks.json
        methods:
          - GET
        strip_path: false
      # Login gets its own route so it can carry a stricter, per-IP limit
      # against credential stuffing (the service-wide limit is per token).
      - name: iam-login-route
        paths:
          - /api/v1/auth/login
        methods:
          - POST
          - OPTIONS
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              minute: 20
              hour: 200
              policy: local
              limit_by: ip
    plugins:
      - name: cors
        config: &common_cors
          origins:
            - http://localhost:4200
            - https://guardian-escolar.vercel.app
            - https://2btcbqw-anonymous-9081.exp.direct
            - https://incurred-stroke-town-fares.trycloudflare.com
            - https://school-guardian.duckdns.org
            - https://scarecrow-backspin-vanish.ngrok-free.dev
            - capacitor://localhost
            - ionic://localhost
            - http://localhost
            - https://localhost
            - http://192.168.100.211:8081
            - http://192.168.100.211:8082
          methods:
            - GET
            - HEAD
            - POST
            - PUT
            - PATCH
            - DELETE
            - OPTIONS
          headers:
            - Accept
            - Authorization
            - Content-Type
            - Origin
            - X-Requested-With
          exposed_headers:
            - Location
          credentials: true
          max_age: 3600
          preflight_continue: false
      - name: rate-limiting
        config:
          minute: 300
          policy: local
          limit_by: header
          header_name: Authorization

  - name: ms-user-management
    url: http://ms-user-management:8080
    routes:
      - name: user-management-route
        paths:
          - /user
        methods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS
        strip_path: true
    plugins:
      - name: cors
        config: *common_cors

  - name: ms-fleet
